<!-- App-icons recipe reference for a mixed platform package containing iOS.
     Replace APP_NAME with the supplied app name, RUN_ROOT with the manifest's
     run root (including its trailing slash), and RUN_ID with that run's id.
     Replace MACOS_PNG_REF and LINUX_PNG_REF with actual PNG paths from
     the manifest. Keep only requested platforms and include every run. -->
<style>
  .platform-icons { grid-template-columns: repeat(auto-fit,minmax(96px,1fr)); gap: 24px; }
</style>
<div class="sp-page">
  <h1 class="sp-title">APP_NAME</h1>
  <p class="sp-sub">iOS, Android, macOS, Windows and Linux app icons</p>
  <!-- Choose each named PNG from pkg.manifest(), honoring custom naming.
       Remove a platform only when it was not requested. -->
  <stimma-section label="Platform icons">
    <stimma-grid class="platform-icons">
      <stimma-media ref="RUN_ROOTios/AppIcon.appiconset/icon-180.png" size="96" caption="iOS"></stimma-media>
      <stimma-media ref="RUN_ROOTandroid/mipmap-xxxhdpi/ic_launcher.png" size="96" caption="Android"></stimma-media>
      <stimma-media ref="MACOS_PNG_REF" size="96" caption="macOS"></stimma-media>
      <stimma-media ref="RUN_ROOTwindows/icon-256.png" size="96" caption="Windows"></stimma-media>
      <stimma-media ref="LINUX_PNG_REF" size="96" caption="Linux"></stimma-media>
    </stimma-grid>
  </stimma-section>
  <stimma-section label="At actual size">
    <stimma-sizes>
      <stimma-media ref="RUN_ROOTios/AppIcon.appiconset/icon-180.png" size="180" caption="180 px"></stimma-media>
      <stimma-media ref="RUN_ROOTios/AppIcon.appiconset/icon-120.png" size="120" caption="120 px"></stimma-media>
      <stimma-media ref="RUN_ROOTios/AppIcon.appiconset/icon-87.png" size="87" caption="87 px"></stimma-media>
      <stimma-media ref="RUN_ROOTios/AppIcon.appiconset/icon-60.png" size="60" caption="60 px"></stimma-media>
      <stimma-media ref="RUN_ROOTios/AppIcon.appiconset/icon-40.png" size="40" caption="40 px"></stimma-media>
      <stimma-media ref="RUN_ROOTios/AppIcon.appiconset/icon-29.png" size="29" caption="29 px"></stimma-media>
      <stimma-media ref="RUN_ROOTios/AppIcon.appiconset/icon-20.png" size="20" caption="20 px"></stimma-media>
    </stimma-sizes>
  </stimma-section>
  <!-- Keep each requested platform; refs must come from the actual run manifest. -->
  <stimma-section label="Platform Study · iOS" page layout="pair">
    <stimma-media ref="RUN_ROOTpreviews/device-studio.png"></stimma-media>
    <stimma-media ref="RUN_ROOTpreviews/device-lifestyle.png"></stimma-media>
    <details slot="details">
      <summary>Details</summary>
      <stimma-appearance label="Appearance">
        <stimma-grid when="light">
          <stimma-media ref="RUN_ROOTpreviews/ios-store-light.png" caption="App Store"></stimma-media>
          <stimma-media ref="RUN_ROOTpreviews/ios-notification-light.png" caption="Notification"></stimma-media>
        </stimma-grid>
        <stimma-grid when="dark">
          <stimma-media ref="RUN_ROOTpreviews/ios-store-dark.png" caption="App Store"></stimma-media>
          <stimma-media ref="RUN_ROOTpreviews/ios-notification-dark.png" caption="Notification"></stimma-media>
        </stimma-grid>
      </stimma-appearance>
    </details>
  </stimma-section>
  <stimma-section label="Platform Study · Android" page layout="pair">
    <stimma-media ref="RUN_ROOTpreviews/platform-android-studio.png"></stimma-media>
    <stimma-media ref="RUN_ROOTpreviews/platform-android.png"></stimma-media>
    <details slot="details">
      <summary>Details</summary>
      <stimma-appearance label="Appearance">
        <stimma-grid when="light">
          <stimma-media ref="RUN_ROOTpreviews/android-store-light.png" caption="Google Play"></stimma-media>
          <stimma-media ref="RUN_ROOTpreviews/android-notification-light.png" caption="Notification"></stimma-media>
        </stimma-grid>
        <stimma-grid when="dark">
          <stimma-media ref="RUN_ROOTpreviews/android-store-dark.png" caption="Google Play"></stimma-media>
          <stimma-media ref="RUN_ROOTpreviews/android-notification-dark.png" caption="Notification"></stimma-media>
        </stimma-grid>
      </stimma-appearance>
    </details>
  </stimma-section>
  <stimma-section label="Platform Study · macOS" page layout="single">
    <stimma-media ref="RUN_ROOTpreviews/platform-macos.png"></stimma-media>
  </stimma-section>
  <stimma-section label="Platform Study · Windows" page layout="stack">
    <stimma-media ref="RUN_ROOTpreviews/platform-windows-start.png" caption="Start menu"></stimma-media>
    <stimma-media ref="RUN_ROOTpreviews/platform-windows-taskbar.png" caption="Taskbar"></stimma-media>
  </stimma-section>
  <stimma-section label="Platform Study · Linux" page layout="pair">
    <stimma-media ref="RUN_ROOTpreviews/platform-linux.png" caption="Ubuntu"></stimma-media>
    <stimma-media ref="RUN_ROOTpreviews/platform-linux-kde.png" caption="KDE Plasma"></stimma-media>
  </stimma-section>
  <stimma-section label="Files" page>
    <stimma-columns>
      <stimma-column title="iOS">AppIcon.appiconset and Contents.json for Xcode.</stimma-column>
      <stimma-column title="Android">Launcher icons, adaptive layers and Play Store icon.</stimma-column>
      <stimma-column title="macOS">An ICNS file and PNG sizes for the app bundle.</stimma-column>
      <stimma-column title="Windows">An ICO file and PNG sizes.</stimma-column>
      <stimma-column title="Linux">PNG sizes in the hicolor icon directory layout.</stimma-column>
    </stimma-columns>
    <stimma-files ref="RUN_ID"></stimma-files>
  </stimma-section>
</div>
